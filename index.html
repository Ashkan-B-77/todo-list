<!DOCTYPE html>
<html lang='en'>
<head>
    <meta charset='utf-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1'>
    <title>ToDo List App</title>
    <link rel='stylesheet' href='style.css'>
    <script defer src="script.js"></script>
</head>
<body>
    <h1>ToDo List</h1>
    <hr> <!-- add a line break under the heading -->

    <p id="numOfCompletes">Number of Completed Tasks:</p>
    
    <label for="taskInput">ToDo Tasks:</label>
    <input type="text" id="taskInput">
    <button type="button" id="addTaskBtn">Add Task</button>
    <span id="warningMsg"></span> <!-- placeholder for warning message in case the input is empty -->

    <ul id="taskList"></ul>
    
</body>
</html>
