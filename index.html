<!DOCTYPE html>
<html lang='en'>
<head>
    <meta charset='utf-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1'>
    <title>To-Do List App</title>
    <link rel='stylesheet' href='style.css'>
    <script defer src="script.js"></script>
</head>
<body>
    <h1>To-Do List</h1>
    <hr> <!-- add a line break under the heading -->

    <p id="numOfCompletesText">Number of Completed Tasks: <span id="numOfCompletes">0</span></p>
    
    <label for="taskInput">To-Do Tasks:</label>
    <input type="text" id="taskInput" placeholder="New Task...">
    <button type="button" id="addTaskBtn">Add Task</button>
    <span id="warningMsg"></span> <!-- placeholder for warning message in case the input is empty -->

    <ul id="taskList"></ul>
    
</body>
</html>
